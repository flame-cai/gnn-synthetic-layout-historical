schema_version: 2

# Continue the trusted serialized SplineCNN model while using only the
# human-corrected graph nodes and text-line labels for fine-tuning.
augmentation_config: src/configs/augment.yaml
preprocessing_config: app/pretrained_gnn/gnn_preprocessing_v2.yaml

expected_model_class: gnn_training.training.models.gnn_models.EdgeClassifier
expected_backbone_class: gnn_training.training.models.gnn_models.SplineConvBackbone
trainable_scope: full_model

# Do not recover raw CRAFT nodes removed by the annotator. This avoids mapping
# node-deletion decisions into potentially conflicting all-negative edge labels.
deleted_node_supervision:
  enabled: false

history_replay_ratio: 0.20

device: auto
random_seed: 43
checkpoint_metric: val_textline_f1_score

training_params:
  epochs: 10
  batch_size: 4
  learning_rate: 0.001
  lr_warmup_epochs: 5
  optimizer: Adam
  imbalance_handler: focal_loss
  focal_loss_alpha: 0.90
  focal_loss_gamma: 2.0
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001
  early_stopping_mode: max
